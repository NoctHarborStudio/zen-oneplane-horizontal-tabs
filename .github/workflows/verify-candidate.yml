name: Verify integration candidate
on:
  push:
    branches: [integration/unified-core]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check release policy regressions
        run: python -m unittest discover -s tests -p 'test_release.py'
      - name: Check package metadata
        run: python scripts/verify-release.py --offline
      - name: Check reproducible build and full regression suite
        run: npm run verify
