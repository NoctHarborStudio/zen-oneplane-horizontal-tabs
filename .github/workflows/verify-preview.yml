name: Verify preview package
on:
  pull_request:
    branches: [preview]
  push:
    branches: [preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Preview gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Sine publication contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          python scripts/verify-release.py --offline
          if [ -n "$BASE_SHA" ]; then
            python scripts/check-publication.py --base "$BASE_SHA"
          else
            python scripts/check-publication.py
          fi
      - name: Check reproducible build and algorithm regressions
        run: npm run verify
      - name: Check Raw GitHub and Sine download archive
        if: github.event_name != 'pull_request'
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if python scripts/verify-release.py; then exit 0; fi
            sleep 30
          done
          exit 1
