name: Verify preview package
on:
  push:
    branches: [preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check release policy regressions
        run: python -m unittest discover -s tests -p 'test_release.py'
      - name: Check Sine publication metadata before build
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          python scripts/verify-release.py --offline --history --before "$PUSH_BEFORE"
      - name: Check reproducible build and algorithm regressions
        run: npm run verify
      - name: Check Raw GitHub and Sine download archive
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if python scripts/verify-release.py; then exit 0; fi
            sleep 30
          done
          exit 1
