name: Verify preview package
on:
  push:
    branches: [preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check package metadata and source syntax
        run: |
          python scripts/verify-release.py --offline
          node --check layout.uc.mjs
          python - <<'PY'
          import json, subprocess, datetime
          current = json.load(open("theme.json"))
          previous = json.loads(subprocess.check_output(["git", "show", "HEAD^:theme.json"]))
          assert current["id"] == previous["id"]
          assert current["homepage"] == previous["homepage"]
          date = lambda x: datetime.datetime.fromisoformat(x.replace("Z", "+00:00"))
          assert date(current["updatedAt"]) > date(previous["updatedAt"])
          PY
      - name: Check Raw GitHub and Sine download archive
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if python scripts/verify-release.py; then exit 0; fi
            sleep 30
          done
          exit 1
